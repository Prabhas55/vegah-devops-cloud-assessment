# Overlay for the STANDBY (DR) host. Activated through COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:dr/compose.standby.yml
# Data tier (postgres + redis) runs warm; the app tier is in the "app" profile
# and is started by scripts/promote.sh (failover) to save RAM and avoid write errors
# against a read-only replica.
services:
  postgres:
    entrypoint: ["/dr/standby-entrypoint.sh"]
    environment:
      PRIMARY_HOST: ${PRIMARY_HOST}
      PRIMARY_PORT: ${PRIMARY_PORT:-5432}
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      REPL_SLOT: ${REPL_SLOT:-standby_slot}
      REPL_APP_NAME: ${REPL_APP_NAME:-standby1}
    ports:
      - "5432:5432"
    volumes:
      - ./dr/standby-entrypoint.sh:/dr/standby-entrypoint.sh:ro
      - ./dr/certs:/certs:ro

  redis:
    command:
      - sh
      - -c
      - |
        if [ -f /data/promoted ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD" --replicaof "$$PRIMARY_HOST" 6379
        fi
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PRIMARY_HOST: ${PRIMARY_HOST}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    profiles: ["app"]
  worker:
    profiles: ["app"]
  frontend:
    profiles: ["app"]
  nginx:
    profiles: ["app"]

volumes:
  redis_data:
